<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.sheet{flex:1;background:#121417;padding:4px 12px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.sh{display:flex;align-items:center;gap:6px;min-height:48px}
.back{width:44px;height:44px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;margin-left:-8px}
.sh b{font-size:18px;flex:1}
.mut{color:#9aa1a9}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ok{background:#4fc06d}.acc{background:#5b9dd9}
.fig{display:flex;align-items:center;gap:14px;padding:0 2px}
.fig .n{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.fig .l{display:flex;flex-direction:column;gap:4px;font-size:13px}
.card{background:#16181b;border:1px solid #262a30;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9aa1a9;display:flex;align-items:center;gap:8px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;min-height:22px;align-items:center}
.lim{display:grid;grid-template-columns:1fr 48px 52px 48px;align-items:center;gap:6px;min-height:50px;border-top:1px solid #262a30}
.cap + .lim{border-top:0}
.st{height:48px;border:1px solid #353b43;border-radius:6px;background:#1d2024;font-size:20px}
.v{text-align:center;font-size:16px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:48px;border:1px solid #353b43;border-radius:6px;background:transparent;font-size:14px;font-weight:600}
.recent{display:flex;align-items:center;gap:8px;min-height:44px;border:0;border-top:1px solid #262a30;background:transparent;padding:0;font-size:12px;text-align:left}
.recent .c{margin-left:auto;color:#9aa1a9;font-size:14px}
.link{display:flex;align-items:center;justify-content:space-between;min-height:44px;border:0;border-top:1px solid #262a30;background:transparent;padding:0;color:#5b9dd9;font-weight:600;font-size:13px}
.stopbar{background:#121417;border-top:1px solid #262a30;padding:10px 12px 12px}
.stop{width:100%;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <section class="sheet" aria-label="Live controls">
    <div class="sh"><button class="back" type="button" aria-label="Back to chat"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#e9e7e2" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg></button><b>Live</b></div>
    <div class="fig"><span class="n mono">48%</span><span class="l"><span>Pace commanded</span><span><i class="dot ok"></i> Playing · Autopilot is choosing</span></span></div>
    <div class="card">
      <div class="row"><span>The Handy</span><span class="mono mut">48% of 50% asked · 15–85</span></div>
      <div class="row"><span>Vibrator</span><span class="mono mut">40% of max 70 · follows</span></div>
    </div>
    <div class="card" style="padding-top: 6px; padding-bottom: 2px">
      <div class="cap">Limits · every source</div>
      <div class="lim"><span>Top speed</span><button class="st" type="button" aria-label="Lower top speed">−</button><span class="v mono">80</span><button class="st" type="button" aria-label="Raise top speed">+</button></div>
      <div class="lim"><span>Stroke low</span><button class="st" type="button" aria-label="Lower the stroke's low end">−</button><span class="v mono">15</span><button class="st" type="button" aria-label="Raise the stroke's low end">+</button></div>
      <div class="lim"><span>Stroke high</span><button class="st" type="button" aria-label="Lower the stroke's high end">−</button><span class="v mono">85</span><button class="st" type="button" aria-label="Raise the stroke's high end">+</button></div>
    </div>
    <div class="two"><button class="btn" type="button">Pause motion</button><button class="btn" type="button">Edge · gentle hold</button></div>
    <div class="card">
      <div class="cap"><i class="dot acc"></i>Autopilot · Active<span class="mono" style="margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500">next check 0:40</span></div>
      <div class="row mut" style="font-size: 12px">Finish target in 12 min · building toward the end</div>
      <div class="two" style="margin: 4px 0"><button class="btn" type="button">Pause Autopilot</button><button class="btn" type="button">Turn off</button></div>
      <button class="recent" type="button" aria-expanded="false"><span class="mono mut">21:41</span><span>Asked 56% · commanded 50% (top speed)</span><span class="c">▾</span></button>
      <button class="link" type="button">Autopilot settings<span>›</span></button>
    </div>
  </section>
  <div class="stopbar"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
