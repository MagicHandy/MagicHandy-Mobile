<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.dim{flex:1;padding:16px;opacity:.3;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.dim b{font-size:17px}
.bub{max-width:78%;background:#1d2024;border:1px solid #353b43;border-radius:10px;padding:9px 12px;line-height:1.45}
.bub.me{align-self:flex-end;background:#1b2634;border-color:#2c3e52}
.sheet{background:#16181b;border-top:1px solid #353b43;border-radius:10px 10px 0 0;padding:4px 16px 8px}
.sh{display:flex;align-items:center;min-height:52px}
.sh b{font-size:18px;flex:1}
.x{width:48px;height:48px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;margin-right:-10px}
.r{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;border:0;border-top:1px solid #262a30;background:transparent;padding:0;text-align:left;font-size:15px}
.r .k{flex:1}
.r .v{color:#c9c6c0;font-size:14px}
.r .c{color:#6b7178;font-size:18px;margin-left:2px}
.app-link{color:#5b9dd9;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px 12px;background:#121417;border-top:1px solid #262a30}
.tab{height:52px;border:0;border-radius:6px;background:transparent;color:#9aa1a9;font-size:12px;font-weight:500}
.tab.open{background:rgba(91,157,217,.15);color:#e9e7e2;font-weight:600}
.stopbar{background:#121417;padding:0 12px 12px}
.stop{width:100%;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <div class="dim" aria-hidden="true"><b>Evening</b><div class="bub me">Let Autopilot take over for a bit.</div><div class="bub">Autopilot has it.</div></div>
  <section class="sheet" role="dialog" aria-label="Settings">
    <div class="sh"><b>Settings</b><button class="x" type="button" aria-label="Close settings"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#c9c6c0" stroke-width="1.8" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div>
    <button class="r" type="button" style="border-top: 0"><span class="k">Motion mode</span><span class="v">Layered</span><span class="c">›</span></button>
    <button class="r" type="button"><span class="k">Style</span><span class="v">Balanced</span><span class="c">›</span></button>
    <button class="r" type="button"><span class="k">Autopilot</span><span class="v">5 of 8 · Talk + adjust</span><span class="c">›</span></button>
    <button class="r" type="button"><span class="k">Persona</span><span class="v">Companion</span><span class="c">›</span></button>
    <button class="r" type="button"><span class="k">Chat model</span><span class="v">Terra · Advanced</span><span class="c">›</span></button>
    <button class="r" type="button"><span class="k">Memory</span><span class="v">Off</span><span class="c">›</span></button>
    <button class="r app-link" type="button"><span class="k">App settings</span><span class="c" style="color: #5b9dd9">›</span></button>
  </section>
  <nav class="tabs" aria-label="Main"><button class="tab" type="button">Chat</button><button class="tab" type="button">Devices</button><button class="tab open" type="button" aria-haspopup="dialog" aria-expanded="true">Settings</button></nav>
  <div class="stopbar"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
