<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenRouter: choose a model</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.main{flex:1;padding:4px 12px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.main>*{flex-shrink:0}
.nav{display:flex;align-items:center;gap:4px;color:#9aa1a9;font-size:13px}
.back{width:48px;height:48px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;margin-left:-12px}
h1{margin:0;font-size:22px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;border:1px solid #4b5159;border-radius:10px;background:#0b0c0e;padding:0 12px;color:#6b7178;font-size:15px}
.chips{display:flex;gap:6px;overflow:hidden}
.chip{height:48px;padding:0 12px;border:1px solid #353b43;border-radius:6px;background:transparent;font-size:13px;font-weight:600;color:#c9c6c0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:rgba(91,157,217,.15);border-color:#5b9dd9;color:#e9e7e2}
.note{margin:0;font-size:12px;color:#9aa1a9;line-height:1.4}
.cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9aa1a9;padding:6px 2px 0}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;flex-shrink:1}
.card{background:#16181b;border:1px solid #262a30;border-radius:10px;padding:0 12px}
.mr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;padding:10px 0;border:0;border-top:1px solid #262a30;background:transparent;text-align:left}
.mr:first-child{border-top:0}
.mr .n{font-size:15px;font-weight:600}
.mr .p{font-size:14px;color:#e9e7e2;text-align:right}
.mr .id{font-size:12px;color:#9aa1a9;grid-column:1/-1}
.mr .d{font-size:13px;color:#c9c6c0;line-height:1.4;grid-column:1/-1}
.mr .tags{grid-column:1/-1;display:flex;gap:6px;margin-top:3px}
.tag{font-size:11px;font-weight:600;border:1px solid;border-radius:4px;padding:1px 6px}
.t-opt{color:#5b9dd9;border-color:rgba(91,157,217,.5)}
.t-req{color:#d8b66a;border-color:rgba(216,182,106,.5)}
.fade{position:relative}
.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(rgba(14,15,17,0),#0e0f11)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 8px;border-top:1px solid #262a30}
.link{min-height:48px;border:0;background:transparent;color:#5b9dd9;font-weight:600;font-size:14px;padding:0}
.foot .note{text-align:right;max-width:190px}
.stopbar{background:#121417;border-top:1px solid #262a30;padding:10px 12px 12px}
.stop{width:100%;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <div class="main">
    <div class="nav"><button class="back" type="button" aria-label="Back to OpenRouter"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#e9e7e2" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg></button>OpenRouter</div>
    <h1>Choose a model</h1>
    <div class="search" role="searchbox" aria-label="Search models"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#9aa1a9" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>Name or ID</div>
    <div class="chips" role="group" aria-label="Order and filter">
      <button class="chip on" type="button" role="radio" aria-checked="true">Popular</button>
      <button class="chip" type="button" role="radio" aria-checked="false">Lowest price</button>
      <button class="chip" type="button" role="checkbox" aria-checked="false">Reasoning optional</button>
    </div>
    <p class="note">Prices are estimates for 100 replies. Reasoning costs extra.</p>
    <div class="list fade">
      <div class="cap">Suggested for motion</div>
      <div class="card">
        <button class="mr" type="button"><span class="n">DeepSeek V4.1 Flash 1017</span><span class="p mono">$0.04</span><span class="id mono">deepseek/deepseek-v4.1-flash-1017</span><span class="d">Quick and low cost. Best with reasoning off.</span><span class="tags"><span class="tag t-opt">Reasoning optional</span></span></button>
        <button class="mr" type="button"><span class="n">GPT-6.1 Terra</span><span class="p mono">$0.33</span><span class="id mono">openai/gpt-6.1-terra</span><span class="d">The most reliable motion in our tests, but slower.</span><span class="tags"><span class="tag t-opt">Reasoning optional</span></span></button>
      </div>
      <div class="cap">All models</div>
      <div class="card">
        <button class="mr" type="button"><span class="n">Hy4 flash</span><span class="p mono">$0.02</span><span class="id mono">tencent/hy4-flash</span><span class="tags"><span class="tag t-opt">Reasoning optional</span></span></button>
        <button class="mr" type="button"><span class="n">DeepSeek V4.1 Flash</span><span class="p mono">$0.06</span><span class="id mono">deepseek/deepseek-v4.1-flash</span><span class="tags"><span class="tag t-opt">Reasoning optional</span></span></button>
        <button class="mr" type="button"><span class="n">GLM 5.3 Flash</span><span class="p mono">$0.09</span><span class="id mono">z-ai/glm-5.3-flash</span><span class="tags"><span class="tag t-req">Reasoning required</span></span></button>
        <button class="mr" type="button"><span class="n">GPT-6 Luna</span><span class="p mono">$0.03</span><span class="id mono">openai/gpt-6-luna</span><span class="tags"><span class="tag t-opt">Reasoning optional</span></span></button>
        <button class="mr" type="button"><span class="n">Claude Opus 5.5</span><span class="p mono">$2.60</span><span class="id mono">anthropic/claude-opus-5.5</span><span class="tags"><span class="tag t-req">Reasoning required</span></span></button>
      </div>
    </div>
    <div class="foot"><button class="link" type="button">Enter a model ID</button><p class="note">Only models that work with MagicHandy, through providers that don't keep your chats, are listed.</p></div>
  </div>
  <div class="stopbar"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
