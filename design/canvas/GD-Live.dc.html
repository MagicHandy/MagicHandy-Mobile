<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphite Deck live controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.dim{height:130px;padding:16px;color:#4b5159;line-height:1.5;font-size:15px;overflow:hidden}
.deck{flex:1;background:#16181b;border-top:1px solid #353b43;border-radius:10px 10px 0 0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:10px}
.dh{display:flex;align-items:center;gap:8px;height:40px}
.dh b{font-size:17px}
.col{margin-left:auto;width:44px;height:40px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ok{background:#4fc06d}.acc{background:#5b9dd9}
.mut{color:#9aa1a9}
.lever{background:#0b0c0e;border:1px solid #262a30;border-radius:10px;padding:10px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px}
.step{height:64px;border:1px solid #353b43;border-radius:6px;background:#1d2024;font-size:26px;font-weight:500}
.stepsm{width:48px;height:52px;border:1px solid #353b43;border-radius:6px;background:#1d2024;font-size:22px;flex:none}
.lv{text-align:center}
.lv .n{font-size:34px;font-weight:600;line-height:1}
.lv .l{font-size:12px;color:#9aa1a9;margin-top:4px}
.track{height:8px;border-radius:4px;background:#262a30;position:relative;margin:14px 10px 10px}
.fill{position:absolute;top:0;bottom:0;border-radius:4px;background:#5b9dd9}
.thumb{position:absolute;top:-14px;width:36px;height:36px;border-radius:50%;background:#e9e7e2;border:3px solid #5b9dd9;box-sizing:border-box}
.ap{background:#0b0c0e;border:1px solid #262a30;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}
.aprow{display:flex;align-items:center;gap:8px}
.three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{height:48px;border:1px solid #353b43;border-radius:6px;background:transparent;font-size:14px;font-weight:600}
.stops{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.stops button{height:44px;border:1px solid #353b43;border-radius:4px;background:transparent;font-size:13px;font-weight:600}
.stops .on{background:#5b9dd9;border-color:#5b9dd9;color:#0b131c}
.stop{height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:auto}
</style>
</helmet>
<div class="app">
  <div class="dim" aria-hidden="true">Autopilot has it. I'll build slowly and check in now and then.</div>
  <section class="deck" aria-label="Live controls">
    <div class="dh"><b>Live</b><i class="dot ok"></i><span class="mut">Autopilot is choosing · pace <span class="mono">48%</span></span><button class="col" type="button" aria-label="Collapse"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#9aa1a9" stroke-width="1.8" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button></div>
    <div class="lever">
      <button class="step" type="button" aria-label="Lower top speed">−</button>
      <div class="lv"><div class="n mono">80%</div><div class="l">Top speed · limits every source</div></div>
      <button class="step" type="button" aria-label="Raise top speed">+</button>
    </div>
    <div class="lever" style="grid-template-columns: 1fr 1fr; gap: 10px">
      <div class="aprow" style="gap: 6px"><button class="stepsm" type="button" aria-label="Lower the stroke's low end">−</button><span class="lv" style="flex: 1"><span class="mono" style="font-size: 22px; font-weight: 600; display: block">15</span><span class="l">Stroke low</span></span><button class="stepsm" type="button" aria-label="Raise the stroke's low end">+</button></div>
      <div class="aprow" style="gap: 6px"><button class="stepsm" type="button" aria-label="Lower the stroke's high end">−</button><span class="lv" style="flex: 1"><span class="mono" style="font-size: 22px; font-weight: 600; display: block">85</span><span class="l">Stroke high</span></span><button class="stepsm" type="button" aria-label="Raise the stroke's high end">+</button></div>
    </div>
    <div class="three"><button class="btn" type="button">Pause</button><button class="btn" type="button">Edge · gentle hold</button></div>
    <div class="ap">
      <div class="aprow"><i class="dot acc"></i><b>Autopilot</b><span class="mut">Active · next change</span><span class="mono" style="margin-left: auto">0:40</span></div>
      <div class="three"><button class="btn" type="button">Pause Autopilot</button><button class="btn" type="button">Stop Autopilot</button></div>
      <div class="aprow"><span>Session buildup</span><span class="mono mut" style="margin-left: auto">42% of 20 min</span></div>
      <button class="btn" type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-weight: 500">Autopilot settings<span class="mut" style="font-size: 13px">Changes 5 of 8 ›</span></button>
    </div>
    <button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
