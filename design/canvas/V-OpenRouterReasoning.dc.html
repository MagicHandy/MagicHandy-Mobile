<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenRouter: reasoning from Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.dim{flex:1;padding:16px;opacity:.3;display:flex;flex-direction:column;gap:14px;overflow:hidden;justify-content:flex-end}
.dim .hd{display:flex;flex-direction:column;gap:2px;margin-bottom:auto}
.dim .hd b{font-size:17px}
.dim .hd span{font-size:12px;color:#9aa1a9}
.bub{max-width:78%;background:#1d2024;border:1px solid #353b43;border-radius:10px;padding:9px 12px;line-height:1.45}
.bub.me{align-self:flex-end;background:#1b2634;border-color:#2c3e52}
.sheet{background:#16181b;border-top:1px solid #353b43;border-radius:10px 10px 0 0;padding:4px 16px 10px;display:flex;flex-direction:column}
.sh{display:flex;align-items:center;gap:2px;min-height:52px}
.sh b{font-size:18px;flex:1}
.ib{width:48px;height:48px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center}
.ib.l{margin-left:-14px}
.ib.r{margin-right:-12px}
.lead{margin:0 0 6px;font-size:14px;color:#c9c6c0;line-height:1.45}
.opt{display:grid;grid-template-columns:1fr 24px;gap:2px 12px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid #262a30;background:transparent;text-align:left}
.opt:first-of-type{border-top:0}
.opt .on{font-size:15px;display:flex;align-items:center;gap:8px}
.opt .od{grid-column:1;color:#9aa1a9;font-size:13px;line-height:1.4}
.opt .chk{grid-row:1/span 2;grid-column:2;display:grid;place-items:center}
.tag{font-size:11px;font-weight:600;border:1px solid;border-radius:4px;padding:1px 6px;color:#5b9dd9;border-color:rgba(91,157,217,.5)}
.tag.neu{color:#9aa1a9;border-color:#353b43}
.hint{margin:8px 0 0;font-size:12.5px;color:#9aa1a9;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px 12px;background:#121417;border-top:1px solid #262a30}
.tab{height:52px;border:0;border-radius:6px;background:transparent;color:#9aa1a9;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab.open{background:rgba(91,157,217,.15);color:#e9e7e2;font-weight:600}
.stopbar{background:#121417;padding:0 12px 12px}
.stop{width:100%;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <div class="dim" aria-hidden="true">
    <div class="hd"><b>Evening</b><span>MagicHandy · GLM 5.3 Flash</span></div>
    <div class="bub me">Slow it down a little and keep the strokes long.</div>
    <div class="bub">Easing off. Long, unhurried strokes for a while.</div>
  </div>
  <section class="sheet" role="dialog" aria-label="Reasoning">
    <div class="sh"><button class="ib l" type="button" aria-label="Back to Chat model"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#e9e7e2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg></button><b>Reasoning</b><button class="ib r" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#c9c6c0" stroke-width="1.8" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div>
    <p class="lead">This model requires reasoning. Lower levels reply faster and cost less.</p>
    <div role="radiogroup" aria-label="Reasoning">
      <button class="opt" type="button" role="radio" aria-checked="true"><span class="on">Low</span><span class="chk"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#5b9dd9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"></path></svg></span></button>
      <button class="opt" type="button" role="radio" aria-checked="false"><span class="on">High</span><span class="chk"></span></button>
    </div>
    <p class="hint">Applies from your next message.</p>
  </section>
  <nav class="tabs" aria-label="Main">
    <button class="tab" type="button"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"></path></svg>Chat</button>
    <button class="tab" type="button"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="5" height="10" rx="1.5"></rect><rect x="9" y="5" width="5" height="8" rx="1.5"></rect></svg>Devices</button>
    <button class="tab open" type="button" aria-haspopup="dialog" aria-expanded="true"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#5b9dd9" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12"></path><circle cx="6" cy="4.5" r="1.8" fill="#121417"></circle><circle cx="10.5" cy="11.5" r="1.8" fill="#121417"></circle></svg>Settings</button>
  </nav>
  <div class="stopbar"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
