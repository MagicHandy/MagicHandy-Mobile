<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat in the Lowlight palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#000000;color:#e9e4db;font-family:Inter,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 12px 8px 16px}
.sess b{font-size:17px;display:block}
.sess span{font-size:12px;color:#beb9b2}
.dv{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:#beb9b2}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ok{background:#4fc06d}.acc{background:#5b9dd9}
.log{flex:1;overflow:hidden;padding:10px 12px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end}
.msg{display:flex;flex-direction:column;max-width:86%}
.me{align-self:flex-end;align-items:flex-end}
.meta{font-size:12px;color:#beb9b2;margin-bottom:4px}
.bub{background:#111111;border:1px solid #2a2724;border-radius:10px 10px 10px 4px;padding:9px 12px;line-height:1.45}
.me .bub{background:#0d1620;border-color:#22344a;border-radius:10px 10px 4px 10px}
.rc{margin-top:6px;font-size:12px;color:#beb9b2}
.deck{background:#0a0a0a;border-top:1px solid #2a2724;border-radius:10px 10px 0 0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.strip{height:48px;border:1px solid #2a2724;border-radius:6px;background:#000000;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-size:14px}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px}
.a{height:48px;border:1px solid #3a3632;border-radius:6px;background:transparent;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.a.on{background:rgba(91,157,217,.16);border-color:transparent}
.field{height:48px;box-sizing:border-box;display:flex;align-items:center;background:#000000;border:1px solid #57524c;border-radius:10px;padding:0 12px;color:#beb9b2;font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px 12px;background:#0a0a0a;border-top:1px solid #2a2724}
.tab{height:52px;border:0;border-radius:6px;background:transparent;color:#beb9b2;font-size:12px;font-weight:500}
.tab.on{background:rgba(91,157,217,.16);color:#e9e4db;font-weight:600}
.stopbar{background:#0a0a0a;padding:0 12px 12px}
.stop{width:100%;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <header class="hdr"><div class="sess"><b>Evening</b><span>Companion · Terra</span></div><div class="dv"><span><i class="dot ok"></i> The Handy · Playing</span><span><i class="dot ok"></i> Vibrator · Playing</span></div></header>
  <main class="log">
    <div class="msg me"><div class="meta">You · 23:10</div><div class="bub">Keep it slow and steady for a while.</div></div>
    <div class="msg"><div class="meta">Companion · 23:10</div><div class="bub">Slow and steady. I'll hold this until you ask for a change.</div><div class="rc mono">Pace 36 → 30 · commanded</div></div>
  </main>
  <section class="deck" aria-label="Controls">
    <div class="strip"><i class="dot ok"></i><span>Playing · Pace <b class="mono">30%</b> commanded</span><i class="dot acc" style="margin-left: auto"></i><span class="mono">1:20</span></div>
    <div class="acts"><button class="a on" type="button" aria-pressed="true"><i class="dot acc"></i>Autopilot</button><button class="a" type="button">Pause</button><button class="a" type="button">Edge</button></div>
    <div class="field">Message</div>
  </section>
  <nav class="tabs" aria-label="Main"><button class="tab on" type="button" aria-current="page">Chat</button><button class="tab" type="button">Devices</button><button class="tab" type="button" aria-haspopup="dialog">Settings</button></nav>
  <div class="stopbar"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
