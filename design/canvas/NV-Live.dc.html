<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native live controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{width:390px;height:844px;box-sizing:border-box;background:#0a0c0f;color:#e2e2e9;font-family:Roboto,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
button{font-family:inherit;color:inherit;cursor:pointer}
.scrim{height:56px}
.sheet{flex:1;background:#1d2024;border-radius:28px 28px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.handle{width:32px;height:4px;border-radius:2px;background:#8e9099;margin:6px auto 4px}
h2{margin:0;font-size:22px;font-weight:400}
.sub{font-size:14px;color:#c4c6cf;margin-top:2px}
.li{display:flex;align-items:center;gap:14px;min-height:48px}
.ico{width:40px;height:40px;border-radius:12px;background:#272a30;display:grid;place-items:center;flex:none}
.li .t{font-size:15px}
.li .s{font-size:13px;color:#c4c6cf}
.li .tr{margin-left:auto;font-size:15px}
.sl{display:flex;flex-direction:column;gap:6px}
.slh{display:flex;justify-content:space-between;font-size:14px}
.trk{position:relative;height:16px}
.act{position:absolute;top:0;bottom:0;border-radius:8px;background:#a8c8ef}
.ina{position:absolute;top:0;bottom:0;border-radius:8px;background:#33363c}
.hd{position:absolute;top:-14px;width:4px;height:44px;border-radius:2px;background:#a8c8ef}
.card{background:#272a30;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sw{width:52px;height:32px;border-radius:16px;background:#a8c8ef;position:relative;flex:none}
.sw::after{content:"";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#0b2a47}
.btns{display:flex;gap:8px}
.tonal{height:44px;padding:0 18px;border:0;border-radius:22px;background:#2b3a4c;color:#d3e4ff;font-size:14px;font-weight:500}
.outl{height:44px;padding:0 18px;border:1px solid #8e9099;border-radius:22px;background:transparent;font-size:14px;font-weight:500}
.disc{display:flex;justify-content:space-between;align-items:center;height:28px;position:relative}
.disc::before{content:"";position:absolute;left:4px;right:4px;top:12px;height:4px;border-radius:2px;background:#33363c}
.disc i{position:relative;width:8px;height:8px;border-radius:50%;background:#8e9099}
.disc i.a{background:#a8c8ef}
.disc i.h{width:20px;height:20px;background:#a8c8ef}
.lp{height:4px;border-radius:2px;background:#33363c;position:relative}
.lp i{position:absolute;left:0;top:0;bottom:0;width:42%;border-radius:2px;background:#a8c8ef}
.stopwrap{background:#1d2024;padding:10px 16px 14px}
.stop{width:100%;height:64px;border:0;border-radius:18px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="app">
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet" aria-label="Live controls">
    <div class="handle" aria-hidden="true"></div>
    <div><h2>Live controls</h2><div class="sub">Playing · Autopilot is choosing</div></div>
    <div class="li"><span class="ico"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#c4c6cf" stroke-width="1.4" aria-hidden="true"><rect x="5" y="1.5" width="6" height="13" rx="2"></rect><path d="M5 6h6"></path></svg></span><div><div class="t">The Handy</div><div class="s">Pace 48% of 50% asked · 15–85</div></div></div>
    <div class="li"><span class="ico"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#c4c6cf" stroke-width="1.4" aria-hidden="true"><rect x="6" y="2" width="4" height="12" rx="2"></rect><path d="M3 6c-1 1.3-1 2.7 0 4M13 6c1 1.3 1 2.7 0 4"></path></svg></span><div><div class="t">Vibrator</div><div class="s">40% of max 70 · follows the pace</div></div></div>
    <div class="sl"><div class="slh"><span>Top speed</span><span class="mono">80%</span></div><div class="trk"><div class="act" style="left: 0; width: calc(80% - 6px)"></div><div class="hd" style="left: calc(80% - 2px)"></div><div class="ina" style="left: calc(80% + 6px); right: 0"></div></div></div>
    <div class="sl"><div class="slh"><span>Stroke</span><span class="mono">15–85</span></div><div class="trk"><div class="ina" style="left: 0; width: calc(15% - 6px)"></div><div class="hd" style="left: calc(15% - 2px)"></div><div class="act" style="left: calc(15% + 6px); width: calc(70% - 12px)"></div><div class="hd" style="left: calc(85% - 2px)"></div><div class="ina" style="left: calc(85% + 6px); right: 0"></div></div></div>
    <div class="card">
      <div class="li" style="min-height: 40px"><div><div class="t" style="font-weight: 500">Autopilot</div><div class="s">Next change in 40 s · segment 3</div></div><span class="sw" style="margin-left: auto" role="img" aria-label="Autopilot on"></span></div>
      <div class="btns"><button class="tonal" type="button">Pause</button><button class="outl" type="button">Stop Autopilot</button></div>
      <div class="slh"><span>Session buildup</span><span class="mono">42% of 20 min</span></div>
      <div class="lp" aria-hidden="true"><i></i></div>
      <div class="li" style="min-height: 44px"><div class="t">Autopilot settings</div><span class="tr" style="color: #c4c6cf">Changes 5 ›</span></div>
    </div>
  </section>
  <div class="stopwrap"><button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="#ffffff"></rect></svg>Stop</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
