<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphite Deck quick menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.app{position:relative;width:390px;height:844px;box-sizing:border-box;background:#0e0f11;color:#e9e7e2;font-family:Inter,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
.hdr{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.t{font-size:16px;font-weight:600}
.s{font-size:12px;color:#9aa1a9;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ok{background:#4fc06d}.acc{background:#5b9dd9}
.log{flex:1;overflow:hidden;padding:10px 14px 12px;display:flex;flex-direction:column;gap:16px;justify-content:flex-end;opacity:.55}
.ai{max-width:92%;line-height:1.5;color:#d9d6d0}
.me{align-self:flex-end;max-width:80%;background:#1b2634;border:1px solid #2c3e52;border-radius:10px 10px 4px 10px;padding:9px 12px;line-height:1.45}
.deck{background:#16181b;border-top:1px solid #353b43;border-radius:10px 10px 0 0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
.now{height:48px;border:1px solid #262a30;border-radius:6px;background:#0b0c0e;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13px}
.chips{display:grid;grid-template-columns:1.5fr 1fr 1fr 48px;gap:6px}
.chip{height:46px;border:1px solid #353b43;border-radius:6px;background:transparent;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:rgba(91,157,217,.15);border-color:transparent}
.chip.open{background:#24282e;border-color:#5b9dd9}
.field{display:flex;align-items:center;gap:8px;background:#0b0c0e;border:1px solid #4b5159;border-radius:10px;padding:4px 4px 4px 12px;height:48px;box-sizing:border-box;color:#9aa1a9;font-size:16px}
.stop{order:2;height:60px;border:0;border-radius:6px;background:#c43c36;color:#ffffff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tab{height:44px;border:0;border-radius:6px;background:transparent;color:#9aa1a9;font-size:12px;font-weight:500}
.tab.on{color:#e9e7e2;font-weight:600;background:#1d2024}
.pop{position:absolute;right:12px;bottom:322px;width:272px;background:#24282e;border:1px solid #353b43;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.55);padding:6px 0}
.pi{display:flex;align-items:center;gap:10px;width:100%;height:46px;border:0;background:transparent;padding:0 14px;font-size:14px;text-align:left}
.pi .v{margin-left:auto;color:#c9c6c0;font-size:13px}
.pi .c{color:#6b7178}
.div{height:1px;background:#353b43;margin:4px 0}
.pcap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9aa1a9;padding:6px 14px 2px}
</style>
</helmet>
<div class="app">
  <header class="hdr">
    <div><div class="t">Evening</div><div class="s">Companion · Terra · Advanced</div></div>
  </header>
  <main class="log" aria-hidden="true">
    <div class="me">Perfect. Let Autopilot take over for a bit.</div>
    <div class="ai">Autopilot has it. I'll build slowly and check in now and then.</div>
  </main>
  <section class="deck" aria-label="Controls">
    <div class="now"><i class="dot ok"></i><span class="mono" style="font-size: 20px; font-weight: 600">48%</span><span style="color: #9aa1a9">Layered · from chat</span><i class="dot acc" style="margin-left: auto"></i><span class="mono">0:40</span></div>
    <div class="chips">
      <button class="chip on" type="button"><i class="dot acc"></i>Autopilot</button>
      <button class="chip" type="button">Pause</button>
      <button class="chip" type="button">Edge</button>
      <button class="chip open" type="button" aria-label="Chat settings" aria-expanded="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#e9e7e2" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12"></path><circle cx="6" cy="4.5" r="1.8" fill="#24282e"></circle><circle cx="10.5" cy="11.5" r="1.8" fill="#24282e"></circle></svg></button>
    </div>
    <div class="field">Message</div>
    <button class="stop" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#ffffff"></rect></svg>Stop</button>
    <nav class="tabs" aria-label="Main"><button class="tab on" type="button" aria-current="page">Chat</button><button class="tab" type="button">Devices</button><button class="tab" type="button">Settings</button></nav>
  </section>
  <div class="pop" role="menu" aria-label="Chat settings">
    <div class="pcap">This chat</div>
    <button class="pi" type="button" role="menuitem">Motion mode<span class="v">Layered</span><span class="c">›</span></button>
    <button class="pi" type="button" role="menuitem">Style<span class="v">Balanced</span><span class="c">›</span></button>
    <button class="pi" type="button" role="menuitem">Autopilot<span class="v">Changes 5 of 8</span><span class="c">›</span></button>
    <button class="pi" type="button" role="menuitem">Persona<span class="v">Companion</span><span class="c">›</span></button>
    <button class="pi" type="button" role="menuitem">Chat model<span class="v">Terra</span><span class="c">›</span></button>
    <div class="div" role="separator"></div>
    <button class="pi" type="button" role="menuitem">All chat settings<span class="c" style="margin-left: auto">›</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
