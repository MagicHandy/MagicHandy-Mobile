// Expose the atlas capture only to the review invocation. It is never packaged in the app.
allprojects { project ->
    project.plugins.withId('org.jetbrains.kotlin.jvm') {
        if (project.name == 'core') {
            project.kotlin.sourceSets.getByName('test').kotlin.srcDir(
                project.rootProject.file('tools/motion-review/android'))
        }
        if (project.name in ['core', 'transport']) project.tasks.named('test') { outputs.upToDateWhen { false } }
    }
}
